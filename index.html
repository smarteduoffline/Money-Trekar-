<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>মানিব্যাগ ট্র্যাকার</title>
<style>
:root{--g:#16a34a;--gd:#14532d;--bg:#cfe6da;--cd:#ecf5f0;--tx:#1b3a2b;--mu:#5b6b63;--r:#e11d48;--b:#2563eb;--o:#ea580c;--p:#7c3aed}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans Bengali","Kalpurush","Siyam Rupali",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px;font-size:15px}
header{position:sticky;top:0;z-index:5;background:#f2f8f5ee;backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{width:42px;height:42px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
header h1{font-size:23px;color:var(--gd)}header h1 span{color:var(--g)}
main{padding:16px;max-width:760px;margin:auto}
h2{font-size:26px;margin:6px 0 2px}.sub{color:var(--mu);margin-bottom:14px}
.hero{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}
.hero b{font-size:20px}.hero p{opacity:.9;margin-top:4px}
.card{background:var(--cd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 1px 6px #0001}
.card.w{background:#fff}.card h3{font-size:17px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid .card{margin:0}.grid small{color:var(--mu)}.grid b{display:block;font-size:24px;margin-top:6px}
.g{color:var(--g)}.r{color:var(--r)}.bl{color:var(--b)}.or{color:var(--o)}.pu{color:var(--p)}
.btn,.bt{border:1px solid #d5dcd8;background:#fff;border-radius:12px;padding:11px 16px;font:inherit;cursor:pointer;color:var(--tx)}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;font-weight:600;margin-bottom:14px;font-size:16px}
.bt.p{background:var(--g);color:#fff;border:0}.bt.s{padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
.li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px}
.li>div:first-child{flex:1;min-width:0}.li small{display:block;color:var(--mu)}
.d{border:0;background:none;font-size:17px;cursor:pointer}
.al{border-radius:16px;padding:12px 16px;margin-bottom:10px;font-weight:600}
.al.bl{background:#e3edfa}.al.or{background:#faeee0}.al small{font-weight:400}
.bar{height:10px;background:#d9e4de;border-radius:9px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;border-radius:9px}
.tabs{display:flex;background:#e3e6ea;border-radius:14px;padding:5px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;font:inherit;cursor:pointer}
.tabs .on{background:var(--b);color:#fff}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{width:100%;padding:12px;border:1px solid #d5dcd8;border-radius:12px;font:inherit;background:#fff;margin:6px 0 10px;color:var(--tx)}
.fl input,.fl select{width:auto;flex:1;margin:0;min-width:130px}
label{display:block;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#fafcfb;display:flex;overflow-x:auto;border-top:1px solid #dde;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:0 0 auto;min-width:76px;border:0;background:none;padding:8px 6px;font:inherit;font-size:12px;color:var(--mu);border-top:3px solid transparent;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:21px}
nav .on{color:var(--g);border-top-color:var(--g);font-weight:700}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
#m.on{display:flex}.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:480px;margin-top:5vh;position:relative}
.box>b{font-size:20px;display:block;margin-bottom:12px}.x{position:absolute;top:14px;right:16px;border:0;background:none;font-size:20px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}
.cal div{padding:9px 0;border-radius:12px;cursor:pointer;position:relative}.cal .h{color:var(--mu);cursor:default}
.cal .t{background:#25a3e3;color:#fff}.cal .s{outline:2px solid var(--g)}
.cal .dot::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--r)}
.empty{text-align:center;color:var(--mu);padding:28px 8px}
.badge{font-size:12px;padding:2px 9px;border-radius:9px;background:#dbe8fb;color:var(--b);margin-left:6px}
.pur{background:linear-gradient(135deg,#8b5cf6,#9333ea);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}
.pur b{font-size:30px;display:block}.pur .row{border-top:1px solid #fff4;padding-top:12px}
a.bt{text-decoration:none;display:inline-block}
header{display:block;padding:8px 12px 4px;padding-top:max(8px,env(safe-area-inset-top))}
.tb{display:flex;align-items:center;gap:8px}
.ib{border:0;background:none;font-size:26px;cursor:pointer;color:var(--tx);position:relative;padding:2px 6px;line-height:1}
.ib.w{background:#fff;border-radius:14px;width:54px;height:54px;font-size:28px;color:#243}
.pl{font-size:13px;padding:6px 12px;border-radius:20px;background:#e3f5ea;color:var(--g);white-space:nowrap}
.pl.off{background:#eee;color:#777}
.ttl{display:flex;align-items:center;gap:6px;background:#fff;color:var(--gd);font-weight:700;flex:1;min-width:0;overflow:hidden}
.ttl img{width:24px;height:24px;border-radius:7px}
.bd{position:absolute;top:-2px;right:0;background:var(--r);color:#fff;font-size:10px;font-style:normal;border-radius:9px;padding:1px 5px}
.tb2{display:flex;justify-content:flex-end;margin-top:4px}
.bk{border:0;background:#e3f5ea;color:var(--g);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;font-weight:600}
.gr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mu);gap:8px}
.ar{color:var(--g);font-size:22px;flex:1;text-align:center}
.pc{background:linear-gradient(135deg,#0f8b6e,#16a34a);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px}
.pr{display:flex;gap:14px;align-items:center}
.av{width:78px;height:78px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:22px;font-weight:700;overflow:hidden;flex:none;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.pi{flex:1;min-width:0;line-height:1.5}.pi b{font-size:18px}
.pt{display:flex;justify-content:space-between;margin-top:18px;font-size:14px;line-height:1.6;gap:8px}
.ck{font-size:26px}
.lv{display:flex;align-items:center;gap:10px;background:#fff;color:var(--tx);border-radius:16px;padding:10px 12px;margin-top:14px;overflow:hidden}
.lb{background:#fde2e8;color:#e11d48;border-radius:14px;padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.mq{overflow:hidden;flex:1;white-space:nowrap}
.mq span{display:inline-block;padding-left:100%;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#ov{display:none;position:fixed;inset:0;background:#0006;z-index:29}
#dw{position:fixed;top:0;bottom:0;right:0;width:80%;max-width:320px;background:#f2f8f5;z-index:30;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;padding:14px;overflow:auto;border-radius:24px 0 0 24px}
body.dopen #dw{transform:none}body.dopen #ov{display:block}
#dw .it{display:flex;align-items:center;gap:14px;padding:10px;border-radius:16px;cursor:pointer;margin-bottom:4px}
#dw .it i{font-style:normal;width:42px;height:42px;border-radius:12px;background:#e3e8e5;display:grid;place-items:center;font-size:20px}
#dw .it.on{background:#b9dcd9;color:var(--g);font-weight:700}
nav button{flex:1;min-width:0}
body.night{--bg:#0f1713;--cd:#17221c;--tx:#e4efe9;--mu:#9fb3a8;--gd:#7ee2a8}
body.night .card.w,body.night .li,body.night .box,body.night input,body.night select,body.night .bt,body.night nav,body.night header,body.night #dw,body.night .ttl,body.night .lv{background:#1b2821;color:var(--tx)}
body.night .tabs{background:#223028}
body.night .bt.p{background:var(--g);color:#fff}
body.night [style*="background:#f3faf6"],body.night [style*="background:#e8eaee"]{background:#24342b!important}
body{font-size:16px}h2{font-size:28px}.card{padding:18px}.li{padding:14px}.grid b{font-size:27px}
.btn{padding:15px;font-size:17px}.bt{padding:12px 16px;font-size:15px}.bt.s{padding:7px 12px;font-size:14px}
input,select{padding:14px;font-size:16px}.pl{font-size:14px}.sub{font-size:15px}
nav button{font-size:13px;padding:10px 4px}nav button i{font-size:25px}.tb2{padding-right:48px}
</style>
</head>
<body>
<header id="hd"></header>
<main id="v"></main>
<nav id="nv"></nav><div id="ov" onclick="dr(0)"></div><aside id="dw"></aside>
<div id="m"></div>
<script>
const K='hisabkhata_v1',$=q=>document.querySelector(q);
const CI=['বেতন','ব্যবসা','ফ্রিল্যান্স','বিনিয়োগ','অন্যান্য আয়'],CE=['খাদ্য','বাড়িভাড়া','পরিবহন','শিক্ষা','স্বাস্থ্য','বিল','কেনাকাটা','বিনোদন','অন্যান্য ব্যয়'];
const RT=['বাড়িভাড়া','বিদ্যুৎ বিল','পানি বিল','গ্যাস বিল','ইন্টারনেট','ফোন বিল','বীমা','ঋণ কিস্তি','সাবস্ক্রিপশন','অন্যান্য'];
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const NAV=[['dash','▦','ড্যাশবোর্ড'],['cal','📅','ক্যালেন্ডার'],['tx','⇄','লেনদেন'],['rem','🔔','রিমাইন্ডার'],['loan','🤝','ধার হিসাব'],['dep','🐷','আমানত'],['shop','🏪','দোকান বাকি'],['bud','🛡','বাজেট'],['set','⚙','সেটিংস']];
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=Object.assign({tx:[],loan:[],dep:[],shop:[],rem:[],bud:{},goal:0},db||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('সংরক্ষণ করা যায়নি')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const M=n=>(n<0?'-':'')+'৳'+bn(Math.abs(+n||0).toLocaleString('en-IN'));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>{const[y,m,x]=d.split('-');return bn(+x)+' '+MN[m-1]+' '+bn(y)};
const dd=d=>Math.round((new Date(d)-new Date(today()))/864e5);
const rel=d=>{const n=dd(d);return n<0?bn(-n)+' দিন আগে':n==0?'আজ':bn(n)+' দিন পরে'};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%;background:${c}"></i></div>`;
const mt=m=>db.tx.filter(x=>x.d.startsWith(m));
const st={month:today().slice(0,7),ty:'',cat:'',q:'',tab:'g',dep:null,cm:today().slice(0,7),cd:today()};
let pg='dash';

function form(t,f,cb,okText){const m=$('#m');
 m.innerHTML=`<div class="box"><b>${t}</b><button class="x" onclick="cl()">✕</button>`+f.map(x=>`<label>${x.l}`+(x.o?`<select name="${x.k}">${x.o.map((o,i)=>`<option value="${Array.isArray(o)?o[0]:o}">${Array.isArray(o)?o[1]:o}</option>`).join('')}</select>`:`<input name="${x.k}" type="${x.t||'text'}" value="${esc(x.v==null?'':x.v)}" placeholder="${x.p||''}" ${x.t=='number'?'inputmode="decimal" min="0"':''}>`)+'</label>').join('')+`<div class="row"><button class="bt" onclick="cl()">বাতিল</button><button class="bt p" id="ok">${okText||'যোগ করুন'}</button></div></div>`;
 m.className='on';$('#ok').onclick=()=>{const o={};m.querySelectorAll('[name]').forEach(e=>o[e.name]=e.value.trim());if(cb(o)!==false)cl()}}
const cl=()=>{$('#m').className='';$('#m').innerHTML=''};
const bad=m=>{alert(m);return false};
const del=(k,id)=>{if(confirm('মুছে ফেলতে চান?')){db[k]=db[k].filter(x=>x.id!=id);save();go()}};
const go=p=>{syncCat();if(p)pg=p;$('#v').innerHTML=P[pg]();chrome()};

function addTx(t){form(t=='i'?'নতুন আয়':'নতুন ব্যয়',[{k:'a',l:'টাকার পরিমাণ',t:'number',p:'0'},{k:'d',l:'তারিখ',t:'date',v:today()},{k:'c',l:'ক্যাটাগরি',o:t=='i'?CI:CE},{k:'n',l:'নোট / মন্তব্য (ঐচ্ছিক)',p:'যেমন: মাসের বাজার'}],o=>{
 if(!(+o.a>0))return bad('সঠিক টাকার পরিমাণ দিন');if(!o.d)return bad('তারিখ দিন');
 db.tx.push({id:uid(),t,a:+o.a,d:o.d,c:o.c,n:o.n});save();go()})}
const txRow=x=>`<div class="li"><div><b>${esc(x.c)}</b><small>${fd(x.d)}${x.n?' • '+esc(x.n):''}</small></div><b class="${x.t=='i'?'g':'r'}">${x.t=='i'?'+':'−'}${M(x.a)}</b><button class="d" onclick="del('tx','${x.id}')">🗑</button></div>`;
const addBtns=()=>`<div class="row" style="margin:0 0 14px"><button class="bt p" onclick="addTx('i')">＋ আয়</button><button class="bt p" style="background:var(--r)" onclick="addTx('e')">＋ ব্যয়</button></div>`;

const P={
dash(){const m=today().slice(0,7),t=mt(m),i=sum(t.filter(x=>x.t=='i'),x=>x.a),e=sum(t.filter(x=>x.t=='e'),x=>x.a),s=i-e,r=i>0?Math.round(s/i*100):0;
 const d=new Date(),al=db.loan.filter(l=>!l.p).map(l=>`<div class="al ${l.k=='g'?'bl':'or'}">${l.k=='g'?esc(l.n)+' এর কাছে পাওনা আছে':esc(l.n)+' কে দেনা আছে'}<br><small>${M(l.a)} — ${rel(l.d)} (${fd(l.d)})</small></div>`).join('');
 const rd=db.rem.filter(x=>{const n=nextRem(x);return n>=0&&n<=3}).map(x=>`<div class="al or">🔔 ${esc(x.t)} — ${nextRem(x)==0?'আজ':bn(nextRem(x))+' দিন পরে'}${x.a?'<br><small>'+M(x.a)+'</small>':''}</div>`).join('');
 const ex={};t.filter(x=>x.t=='e').forEach(x=>ex[x.c]=(ex[x.c]||0)+x.a);const top=Object.entries(ex).sort((a,b)=>b[1]-a[1]);
 const goal=db.goal>0?`<div class="card w"><h3>🐷 সঞ্চয় লক্ষ্যমাত্রা — ${MN[d.getMonth()]}</h3>${M(Math.max(s,0))} / ${M(db.goal)}${bar(s/db.goal*100,'var(--p)')}</div>`:`<div class="card w empty">সঞ্চয় লক্ষ্যমাত্রা নির্ধারণ করুন<br><button class="bt p" style="margin-top:10px" onclick="setGoal()">লক্ষ্যমাত্রা নির্ধারণ করুন</button></div>`;
 return`<div class="hero"><b>${['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'][d.getDay()]}, ${bn(d.getDate())} ${MN[d.getMonth()]} ${bn(d.getFullYear())}</b><p>স্বাগতম! আপনার আজকের হিসাব এক নজরে</p></div>`+addBtns()+al+rd+
 `<div class="grid"><div class="card"><small>মোট আয়</small><b class="g">${M(i)}</b></div><div class="card"><small>মোট ব্যয়</small><b class="r">${M(e)}</b></div><div class="card"><small>মোট সঞ্চয়</small><b class="pu">${M(s)}</b></div><div class="card"><small>সঞ্চয় হার</small><b style="color:#b45309">${bn(r)}%</b></div></div>`+goal+
 `<div class="card"><h3>শীর্ষ ব্যয় (এই মাস)</h3>${top.length?top.slice(0,5).map(([c,a])=>`<div>${esc(c)} <b class="r" style="float:right">${M(a)}</b>${bar(a/e*100,'var(--r)')}</div>`).join(''):'<div class="empty">এই মাসে কোনো ব্যয় নেই</div>'}</div>`+
 `<div class="card"><h3>সাম্প্রতিক লেনদেন</h3>${db.tx.length?[...db.tx].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5).map(txRow).join(''):'<div class="empty">কোনো লেনদেন নেই। প্রথম লেনদেন যোগ করুন!</div>'}</div>`+
 `<div class="card"><h3>ধার হিসাব</h3><div class="grid"><div class="card bl"><small>আমার পাওনা</small><b>${M(sum(db.loan.filter(l=>!l.p&&l.k=='g'),l=>l.a))}</b></div><div class="card or"><small>আমার দেনা</small><b>${M(sum(db.loan.filter(l=>!l.p&&l.k=='t'),l=>l.a))}</b></div></div></div>`+yearly()},
cal(){const[y,mo]=st.cm.split('-').map(Number),f=new Date(y,mo-1,1).getDay(),n=new Date(y,mo,0).getDate(),ds=new Set(db.tx.map(x=>x.d));let c=['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(f);
 for(let k=1;k<=n;k++){const D=`${y}-${String(mo).padStart(2,'0')}-${String(k).padStart(2,'0')}`;c+=`<div class="${D==today()?'t':''} ${D==st.cd?'s':''} ${ds.has(D)?'dot':''}" onclick="st.cd='${D}';go()">${bn(k)}</div>`}
 const l=db.tx.filter(x=>x.d==st.cd);
 return`<h2>ক্যালেন্ডার</h2><p class="sub">তারিখে ক্লিক করে লেনদেন দেখুন</p><div class="card"><div class="row" style="align-items:center;margin:0 0 10px"><button class="bt" onclick="mv(-1)">‹</button><b style="text-align:center">${MN[mo-1]} ${bn(y)}</b><button class="bt" onclick="mv(1)">›</button></div><div class="cal">${c}</div></div><div class="card"><h3>${fd(st.cd)}</h3>${l.length?l.map(txRow).join(''):'<div class="empty">এই তারিখে কোনো লেনদেন নেই</div>'}</div>`},

function tk(){const t=today(),a=db.tx.filter(x=>x.d==t),m=mt(t.slice(0,7)),f=(l,k)=>sum(l.filter(x=>x.t==k),x=>x.a);
 return['আজকের আয়: '+M(f(a,'i')),'আজকের ব্যয়: '+M(f(a,'e')),'এই মাসের সঞ্চয়: '+M(f(m,'i')-f(m,'e')),'মোট পাওনা: '+M(sum(db.loan.filter(l=>!l.p&&l.k=='g'),l=>l.a)),'মোট দেনা: '+M(sum(db.loan.filter(l=>!l.p&&l.k=='t'),l=>l.a)),'দোকান বাকি: '+M(sum(db.shop.filter(x=>!x.p),x=>x.a)),...db.rem.filter(x=>nextRem(x)<=3).map(x=>'🔔 '+x.t+(nextRem(x)?' — '+bn(nextRem(x))+' দিন পরে':' — আজ'))].join('   •   ')}
function gt(){const h=new Date().getHours();return h<4?'শুভ রাত্রি':h<12?'শুভ সকাল':h<15?'শুভ দুপুর':h<18?'শুভ বিকাল':h<20?'শুভ সন্ধ্যা':'শুভ রাত্রি'}
function pcard(){const p=PF(),d=new Date(),t=tk();
 return`<div class="pc"><div class="pr"><div class="av">${p.img?`<img src="${p.img}" alt="">`:'ছবি'}</div><div class="pi"><b>${esc(p.n)||'আপনার নাম'}</b><div>📍 ${esc(p.a)||'ঠিকানা যোগ করুন'}</div><div>📞 ${esc(p.p)||'ফোন নাম্বার'}</div></div></div><div class="pt"><div><small>এখন সময়</small><div><b id="ck" class="ck"></b> <small id="ap"></small></div><small>📅 ${bn(d.getDate())} ${MN[d.getMonth()]}, ${bn(d.getFullYear())} ইং</small></div><div style="text-align:right"><div>🌙 ${hjD(d)}</div><small>${bnD(d)}</small></div></div><div class="lv"><span class="lb">● লাইভ</span><div class="mq"><span style="animation-duration:${Math.max(20,Math.round(t.length*.32))}s">${esc(t)}</span></div></div></div>`}
function editPf(){const p=PF();form('প্রোফাইল',[{k:'n',l:'নাম',v:p.n,p:'আপনার নাম'},{k:'a',l:'ঠিকানা',v:p.a,p:'ঠিকানা লিখুন'},{k:'p',l:'ফোন নাম্বার',v:p.p,t:'tel',p:'01XXXXXXXXX'}],o=>{Object.assign(p,{n:o.n,a:o.a,p:o.p});save();go()},'সংরক্ষণ')}
function pickPhoto(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(im.width,im.height);c.width=c.height=160;c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,160,160);PF().img=c.toDataURL('image/jpeg',.8);save();URL.revokeObjectURL(im.src);go()};im.src=URL.createObjectURL(f)};i.click()}
const adj=(k,v)=>{AJ()[k]=Math.max(-2,Math.min(2,(AJ()[k]||0)+v));save();go()};
P.dash=(o=>()=>`<div class="gr"><span>👋 ${gt()}</span><span class="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</span></div>`+pcard()+o().replace(/<div class="hero">.*?<\/div>/,''))(P.dash);

function fit(){const z=document.documentElement,s=screen.width,w=innerWidth;z.style.zoom='';if(s<700&&w>s*1.2)z.style.zoom=(w/s).toFixed(3)}
fit();addEventListener('resize',fit);addEventListener('orientationchange',fit);
P.set=(o=>()=>{const p=PF(),d=new Date(),A=k=>AJ()[k]||0;
 const pc=`<div class="card w"><h3>👤 প্রোফাইল</h3><div style="display:flex;gap:14px;align-items:center"><div class="av" style="background:#e3f5ea;color:#16a34a" onclick="pickPhoto()">${p.img?`<img src="${p.img}" alt="">`:'ছবি'}</div><div style="flex:1;min-width:0;line-height:1.6"><b>${esc(p.n)||'নাম দেওয়া হয়নি'}</b><br><small>📍 ${esc(p.a)||'ঠিকানা নেই'}</small><br><small>📞 ${esc(p.p)||'ফোন নেই'}</small></div></div><div class="row"><button class="bt" onclick="pickPhoto()">📷 ছবি পরিবর্তন</button><button class="bt p" onclick="editPf()">✏️ নাম-ঠিকানা-ফোন</button></div>${p.img?'<button class="bt s" style="margin-top:8px" onclick="delete PF().img;save();go()">ছবি মুছুন</button>':''}</div>`;
 const dc=`<div class="card w"><h3>📅 আরবি ও বাংলা তারিখ সমন্বয়</h3><p class="sub">চাঁদ দেখার ভিন্নতার জন্য তারিখ ১ দিন আগে বা পরে করুন।</p><div style="margin-bottom:10px">🌙 ${hjD(d)}<br>${bnD(d)}</div>`+[['h','আরবি (হিজরি)'],['b','বাংলা']].map(x=>`<div class="row" style="align-items:center"><span style="flex:1.3">${x[1]}</span><button class="bt s" onclick="adj('${x[0]}',-1)">◀ আগে</button><b style="text-align:center">${A(x[0])>0?'+':''}${bn(A(x[0]))}</b><button class="bt s" onclick="adj('${x[0]}',1)">পরে ▶</button></div>`).join('')+'</div>';
 return o().replace('ক্যাটাগরি পরিচালনা করুন</p>','প্রোফাইল, তারিখ ও ক্যাটাগরি</p>'+pc+dc)})(P.set);
addEventListener('online',chrome);addEventListener('offline',chrome);setInterval(tick,1000);applyNight();
go();
</script>
</body>
